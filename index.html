<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KEM · Official</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Roboto,sans-serif}
body{
    width:100%;min-height:100vh;
    background:#060810;
    color:#eef2ff;
    display:grid;place-items:center;
    padding:16px;
    overflow:hidden;
}

/* 动态星云背景（纯CSS，性能友好） */
.bg{
    position:fixed;inset:0;
    background:
        radial-gradient(circle at 20% 10%, rgba(59,130,246,.18) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(96,165,250,.18) 0%, transparent 40%),
        radial-gradient(circle at 40% 50%, rgba(147,197,253,.1) 0%, transparent 50%);
    z-index:-1;
    animation:bgShift 12s ease-in-out infinite alternate;
}
@keyframes bgShift{
    0%{transform:translate(0,0) scale(1)}
    100%{transform:translate(-2%,-2%) scale(1.02)}
}

/* 开场3D旋转+霓虹光效 */
.splash{
    position:fixed;inset:0;
    background:#060810;
    display:grid;place-items:center;
    z-index:999;
    transition:opacity 1s ease;
}
.splash.hide{opacity:0;pointer-events:none}
.logo-big{
    font-size:72px;font-weight:800;
    background:linear-gradient(135deg,#3b82f6,#60a5fa,#2563eb);
    background-size:200% 200%;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation:kemGlowIn 1.4s cubic-bezier(0.25,1,0.5,1) forwards;
    filter:drop-shadow(0 0 12px rgba(59,130,246,.4));
}
@keyframes kemGlowIn{
    0%{transform:scale(0.3) rotateY(-120deg);opacity:0;filter:blur(6px) drop-shadow(0 0 0 rgba(59,130,246,0))}
    60%{transform:scale(1.15) rotateY(0);opacity:1}
    100%{transform:scale(1);opacity:1;filter:blur(0) drop-shadow(0 0 14px rgba(59,130,246,.5))}
}

/* 主卡片：毛玻璃+流光边框 */
.card{
    width:100%;max-width:380px;
    background:rgba(15,20,35,.75);
    backdrop-filter:blur(12px); /* 适度模糊，不卡手机 */
    border-radius:24px;padding:40px 28px;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 25px 70px rgba(0,0,0,.4),0 0 0 1px rgba(59,130,246,.12);
    opacity:0;
    transform:translateY(30px);
    animation:fadeUp 1s .6s ease forwards;
    position:relative;
    overflow:hidden;
}
/* 流光边框 */
.card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,#3b82f6,#60a5fa,#2563eb,#3b82f6);
    background-size:300% 100%;
    animation:flow 5s linear infinite;
}
@keyframes flow{0%{background-position:0 0}100%{background-position:300% 0}}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

/* 头部品牌+认证徽章 */
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.brand{font-size:24px;font-weight:700}
.brand span{
    background:linear-gradient(135deg,#3b82f6,#60a5fa);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.badge{
    font-size:10px;font-weight:600;padding:4px 10px;
    border-radius:999px;
    background:rgba(59,130,246,.15);
    color:#93c5fd;
    border:1px solid rgba(59,130,246,.2);
    animation:pulse 2.5s infinite alternate;
}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(59,130,246,.2)}100%{box-shadow:0 0 0 8px transparent}}

/* 标题区 */
.title{text-align:center;margin-bottom:24px}
.title h1{font-size:22px;font-weight:600;margin-bottom:8px}
.title p{color:#94a3b8;font-size:14px;line-height:1.5}

/* 群号：霓虹发光 */
.group{
    background:rgba(30,41,59,.45);
    border-radius:18px;padding:22px;text-align:center;
    margin-bottom:28px;
    border:1px solid rgba(255,255,255,.06);
}
.group small{color:#94a3b8;font-size:12px}
.group .num{
    font-size:28px;font-weight:700;
    margin-top:8px;
    background:linear-gradient(135deg,#3b82f6,#60a5fa);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation:glow 3s infinite alternate;
}
@keyframes glow{0%{filter:brightness(1) drop-shadow(0 0 6px rgba(59,130,246,.2))}100%{filter:brightness(1.2) drop-shadow(0 0 14px rgba(59,130,246,.4))}}

/* 按钮：渐变+微动效 */
.btns{display:flex;flex-direction:column;gap:12px}
.btn{
    padding:16px;border-radius:16px;
    border:none;font-size:16px;font-weight:600;
    cursor:pointer;transition:all .25s ease;
}
.btn.main{
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    color:#fff;
    box-shadow:0 6px 20px rgba(59,130,246,.25);
}
.btn.sec{
    background:rgba(49,58,74,.5);
    color:#eef2ff;
    border:1px solid rgba(255,255,255,.08);
}
.btn:hover{transform:translateY(-2px) scale(1.02)}
.btn:active{transform:translateY(0) scale(.98)}

/* 底部 */
.foot{margin-top:24px;text-align:center;font-size:12px;color:#94a3b8}
.foot strong{color:#93c5fd}
</style>
</head>
<body>

<div class="bg"></div>

<!-- 开场遮罩 -->
<div class="splash" id="splash">
    <div class="logo-big">KEM</div>
</div>

<!-- 主内容 -->
<div class="card">
    <div class="head">
        <div class="brand">KEM<span>官方</span></div>
        <div class="badge">AUTHORIZED</div>
    </div>
    
    <div class="title">
        <h1>官方交流社群</h1>
        <p>加入官方渠道，获取最新资源与服务支持</p>
    </div>

    <div class="group">
        <small>官方 QQ 群号</small>
        <div class="num">1082223192</div>
    </div>

    <div class="btns">
        <button class="btn main" onclick="copyText('1082223192')">复制 QQ 群</button>
        <button class="btn sec" onclick="window.open('https://t.me/KEMGFTp','_blank')">Telegram</button>
        <button class="btn sec" onclick="window.open('https://new.818fka.com/shop/wdCc','_blank')">官方卡网</button>
    </div>

    <div class="foot">官方频道：<strong>@KEMGFTp</strong></div>
</div>

<script>
// 复制功能（兼容手机）
function copyText(text){
    navigator.clipboard.writeText(text).then(()=>{
        alert("已复制：" + text);
    }).catch(()=>{
        const input=document.createElement("input");
        input.value=text;
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        document.body.removeChild(input);
        alert("已复制：" + text);
    });
}

// 自动隐藏开场
window.onload = function(){
    setTimeout(()=>{
        document.getElementById('splash').classList.add('hide');
    }, 1600);
}
</script>

</body>
</html>
