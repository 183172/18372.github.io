<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KEM · Official</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Roboto,sans-serif}
body{
    width:100%;min-height:100vh;
    background:#060810;
    color:#eef2ff;
    display:grid;place-items:center;
    padding:16px;
}

/* 动态星云背景 */
.bg{
    position:fixed;inset:0;
    background:
        radial-gradient(circle at 15% 10%, rgba(59,130,246,.22) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(96,160,250,.22) 0%, transparent 45%),
        radial-gradient(circle at 45% 50%, rgba(147,197,253,.12) 0%, transparent 55%);
    z-index:-1;
    animation:bgShift 10s ease-in-out infinite alternate;
}
@keyframes bgShift{
    0%{transform:translate(0,0) scale(1)}
    100%{transform:translate(-3%,-3%) scale(1.04)}
}

/* 开场 */
.splash{
    position:fixed;inset:0;
    background:#060810;
    display:grid;place-items:center;
    z-index:999;
    transition:opacity 1.1s cubic-bezier(0.2,1,0.4,1);
}
.splash.hide{opacity:0;pointer-events:none}
.logo-big{
    font-size:80px;font-weight:900;letter-spacing:4px;
    background:linear-gradient(135deg,#3b82f6,#60a5fa,#2563eb,#8b5cf6);
    background-size:300% 300%;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation:kemGlowIn 1.6s cubic-bezier(0.25,1,0.5,1) forwards;
    filter:drop-shadow(0 0 20px rgba(59,130,246,.5));
    cursor:pointer;
    user-select:none;
    transition:transform 0.2s ease;
}
.logo-big:hover{transform:scale(1.05)}
@keyframes kemGlowIn{
    0%{transform:scale(0.2) rotateY(-180deg);opacity:0;filter:blur(8px) drop-shadow(0 0 0 rgba(59,130,246,0))}
    60%{transform:scale(1.2) rotateY(0);opacity:1}
    100%{transform:scale(1);opacity:1;filter:blur(0) drop-shadow(0 0 24px rgba(59,130,246,.6))}
}

/* 全屏闪光 */
.flash{
    position:fixed;inset:0;
    background:rgba(255,255,255,0.9);
    opacity:0;
    pointer-events:none;
    z-index:1000;
    transition:opacity 0.1s ease;
}
.flash.active{opacity:1;animation:flashFade 0.6s ease forwards}
@keyframes flashFade{
    0%{opacity:1}
    100%{opacity:0}
}

/* 彩虹闪光 */
.rainbow-flash{
    position:fixed;inset:0;
    background:linear-gradient(90deg,#ff5e5e,#ffca5e,#5eff8b,#5ebeff,#b95eff);
    background-size:400% 400%;
    opacity:0;
    pointer-events:none;
    z-index:1001;
    animation:rainbow 1s ease infinite;
}
.rainbow-flash.active{opacity:1;animation:rainbowFlash 1.2s ease forwards}
@keyframes rainbow{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}
@keyframes rainbowFlash{
    0%{opacity:0;transform:scale(1.1)}
    20%{opacity:1}
    80%{opacity:1}
    100%{opacity:0;transform:scale(1)}
}

/* 装逼文字弹窗 */
.ultra-tip{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    color:#fff;font-size:22px;font-weight:700;
    text-shadow:0 0 15px #fff;
    opacity:0;z-index:1002;
    pointer-events:none;
}
.ultra-tip.show{animation:tipShow 1.2s ease forwards}
@keyframes tipShow{
    0%{opacity:0;transform:translate(-50%,-50%) scale(0.5)}
    30%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
    70%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1)}
}

/* 主卡片 */
.card{
    width:100%;max-width:380px;
    background:rgba(15,20,35,.8);
    backdrop-filter:blur(16px);
    border-radius:28px;padding:44px 32px;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 1px rgba(59,130,246,.18);
    opacity:0;
    transform:translateY(40px);
    animation:fadeUp 1.2s .7s cubic-bezier(0.2,1,0.4,1) forwards;
    position:relative;
    overflow:hidden;
}
.card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,#3b82f6,#60a5fa,#2563eb,#8b5cf6,#3b82f6);
    background-size:400% 100%;
    animation:flow 4s linear infinite;
}
@keyframes flow{0%{background-position:0 0}100%{background-position:400% 0}}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.brand{font-size:26px;font-weight:800}
.brand span{
    background:linear-gradient(135deg,#3b82f6,#60a5fa);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.badge{
    font-size:11px;font-weight:700;padding:5px 12px;
    border-radius:999px;
    background:rgba(59,130,246,.2);
    color:#93c5fd;
    border:1px solid rgba(59,130,246,.25);
    animation:pulse 2s infinite alternate;
}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(59,130,246,.3)}100%{box-shadow:0 0 0 10px transparent}}

.title{text-align:center;margin-bottom:28px}
.title h1{font-size:24px;font-weight:700;margin-bottom:10px}
.title p{color:#94a3b8;font-size:14px;line-height:1.6}

/* 团队成员 */
.team{
    text-align:center;
    font-size:14px;
    color:#93c5fd;
    margin-bottom:24px;
}

.group{
    background:rgba(30,41,59,.5);
    border-radius:20px;padding:26px;text-align:center;
    margin-bottom:32px;
    border:1px solid rgba(255,255,255,.08);
}
.group small{color:#94a3b8;font-size:13px}
.group .num{
    font-size:32px;font-weight:800;
    margin-top:10px;
    background:linear-gradient(135deg,#3b82f6,#60a5fa,#2563eb);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation:glow 2.5s infinite alternate;
}
@keyframes glow{0%{filter:brightness(1) drop-shadow(0 0 8px rgba(59,130,246,.3))}100%{filter:brightness(1.3) drop-shadow(0 0 18px rgba(59,130,246,.5))}}

.btns{display:flex;flex-direction:column;gap:14px}
.btn{
    padding:18px;border-radius:18px;
    border:none;font-size:16px;font-weight:700;
    cursor:pointer;transition:all 0.3s cubic-bezier(0.2,1,0.4,1);
}
.btn.main{
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    color:#fff;
    box-shadow:0 8px 24px rgba(59,130,246,.3);
}
.btn.sec{
    background:rgba(49,58,74,.6);
    color:#eef2ff;
    border:1px solid rgba(255,255,255,.1);
}
.btn:hover{transform:translateY(-3px) scale(1.03)}
.btn:active{transform:translateY(0) scale(.97)}

.foot{margin-top:30px;text-align:center;font-size:13px;color:#94a3b8}
.foot strong{color:#93c5fd;font-weight:700}
</style>
</head>
<body>

<div class="bg"></div>
<div class="flash" id="flash"></div>
<div class="rainbow-flash" id="rainbow"></div>
<div class="ultra-tip" id="tip">KEM · 制作团队</div>

<div class="splash" id="splash">
    <div class="logo-big" id="kemLogo">KEM</div>
</div>

<div class="card">
    <div class="head">
        <div class="brand">KEM<span>官方</span></div>
        <div class="badge">AUTHORIZED</div>
    </div>
    
    <div class="title">
        <h1>官方交流社群</h1>
        <p>加入官方渠道，获取最新资源与服务支持</p>
    </div>

    <!-- 团队成员 -->
    <div class="team">团队成员：Cc · 小豪</div>

    <div class="group">
        <small>官方 QQ 群号</small>
        <div class="num">1082223192</div>
    </div>

    <div class="btns">
        <button class="btn main" onclick="copyText('1082223192')">复制 QQ 群</button>
        <button class="btn sec" onclick="window.open('https://t.me/KEMGFTp','_blank')">Telegram</button>
        <button class="btn sec" onclick="window.open('https://new.818fka.com/shop/KEM','_blank')">官方卡网</button>
    </div>

    <div class="foot">官方频道：<strong>@KEMGFTp</strong></div>
</div>

<script>
const logo = document.getElementById('kemLogo');
let longPressTimer;

// 单击 = 普通闪光
logo.addEventListener('click', () => {
    clearTimeout(longPressTimer);
    triggerFlash();
});

// 长按 = 彩虹闪光
logo.addEventListener('mousedown', () => {
    longPressTimer = setTimeout(() => {
        triggerRainbow();
    }, 500);
});
logo.addEventListener('mouseup', () => clearTimeout(longPressTimer));
logo.addEventListener('mouseleave', () => clearTimeout(longPressTimer));

// 手机长按
logo.addEventListener('touchstart', () => {
    longPressTimer = setTimeout(() => triggerRainbow(), 500);
});
logo.addEventListener('touchend', () => clearTimeout(longPressTimer));

// 白闪
function triggerFlash(){
    const f = document.getElementById('flash');
    f.classList.add('active');
    if(navigator.vibrate) navigator.vibrate(50);
    setTimeout(()=>f.classList.remove('active'), 500);
}

// 彩虹闪
function triggerRainbow(){
    document.getElementById('rainbow').classList.add('active');
    document.getElementById('tip').classList.add('show');
    if(navigator.vibrate) navigator.vibrate([50,100,50]);
    setTimeout(()=>{
        document.getElementById('rainbow').classList.remove('active');
        document.getElementById('tip').classList.remove('show');
    }, 1200);
}

// 复制
function copyText(text){
    navigator.clipboard.writeText(text).then(()=>{
        alert("已复制：" + text);
    }).catch(()=>{
        const i=document.createElement("input");i.value=text;
        document.body.appendChild(i);i.select();document.execCommand("copy");
        document.body.removeChild(i);alert("已复制：" + text);
    });
}

// 开场消失
setTimeout(()=>{
    document.getElementById('splash').classList.add('hide');
}, 1700);
</script>

</body>
</html>
